<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Программа — Система силы</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">Система силы</div>
    <nav>
      <a href="index.html">Участники</a>
      <a href="streams.html">Потоки</a>
      <a class="active" href="program.html">Программа</a>
    </nav>
  </header>
  <main class="wrap">
    <h1>Программа</h1>
    <p class="notice">Показ интерфейса. Кнопки на этих страницах ничего не сохраняют.</p>

    <div class="card">
      <form class="row" action="#" onsubmit="return false">
        <label>Поток
          <select>
            <option>Система силы · Поток 1</option>
          </select>
        </label>
        <label>Тренировка
          <select>
            <option>28.09 · 19:00</option>
          </select>
        </label>
      </form>
    </div>

    <div class="card">
      <h2>28 сентября · 19:00</h2>
      <form class="row" action="#" onsubmit="return false" style="margin-bottom:1rem">
        <label>Дата
          <input type="date" value="2026-09-28" required>
        </label>
        <label>Время
          <input type="time" value="19:00" required>
        </label>
        <button type="submit">Изменить</button>
      </form>

      <div class="block">
        <div class="actions" style="justify-content:space-between">
          <strong>Ноги</strong>
          <div class="actions">
            <button type="button" class="secondary">↑</button>
            <button type="button" class="secondary">↓</button>
            <button type="button" class="danger">Удалить</button>
          </div>
        </div>
        <form class="row" action="#" onsubmit="return false" style="margin:.5rem 0">
          <input value="Ноги" required>
          <button type="submit" class="secondary">Переименовать</button>
        </form>
        <div class="exercise">
          <span>Присед</span>
          <div class="actions">
            <button type="button" class="secondary">↑</button>
            <button type="button" class="secondary">↓</button>
            <input value="Присед" required>
            <button type="button" class="secondary">OK</button>
            <button type="button" class="danger">×</button>
          </div>
        </div>
        <div class="exercise">
          <span>Румынская тяга</span>
          <div class="actions">
            <button type="button" class="secondary">↑</button>
            <button type="button" class="secondary">↓</button>
            <input value="Румынская тяга" required>
            <button type="button" class="secondary">OK</button>
            <button type="button" class="danger">×</button>
          </div>
        </div>
        <form class="row" action="#" onsubmit="return false" style="margin-top:.6rem">
          <input placeholder="Новое упражнение" required>
          <button type="submit">Добавить упражнение</button>
        </form>
      </div>

      <div class="block">
        <div class="actions" style="justify-content:space-between">
          <strong>Жим</strong>
          <div class="actions">
            <button type="button" class="secondary">↑</button>
            <button type="button" class="secondary">↓</button>
            <button type="button" class="danger">Удалить</button>
          </div>
        </div>
        <form class="row" action="#" onsubmit="return false" style="margin:.5rem 0">
          <input value="Жим" required>
          <button type="submit" class="secondary">Переименовать</button>
        </form>
        <div class="exercise">
          <span>Жим лёжа</span>
          <div class="actions">
            <button type="button" class="secondary">↑</button>
            <button type="button" class="secondary">↓</button>
            <input value="Жим лёжа" required>
            <button type="button" class="secondary">OK</button>
            <button type="button" class="danger">×</button>
          </div>
        </div>
        <form class="row" action="#" onsubmit="return false" style="margin-top:.6rem">
          <input placeholder="Новое упражнение" required>
          <button type="submit">Добавить упражнение</button>
        </form>
      </div>

      <form class="row" action="#" onsubmit="return false">
        <input placeholder="Новый блок (например Грудь)" required>
        <button type="submit">Добавить блок</button>
      </form>
    </div>

    <div class="card">
      <h2>Участники</h2>
      <table>
        <thead>
          <tr><th>Имя</th><th>Статус</th><th>Доставка</th></tr>
        </thead>
        <tbody>
          <tr>
            <td><a href="result.html">Марина</a></td>
            <td>✓ 2/3</td>
            <td>отправлено</td>
          </tr>
          <tr>
            <td>Олег</td>
            <td>○ 0/3</td>
            <td>ожидание</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
